<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="1000" height="660" fill="#FFFFFF"/>
  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#2C3A32">AI 节律守护 · 智能无感 —— 三端总体架构</text>
  <text x="500" y="56" text-anchor="middle" font-size="12" fill="#7D746B">赛道一提交主体：Vue 3 运营管理 Web 端（橙色高亮）｜ 依据仓库真实源码绘制</text>

  <!-- 客户端层 -->
  <rect x="30" y="76" width="940" height="118" rx="10" fill="#F7F9F6" stroke="#D9E2D7"/>
  <text x="46" y="98" font-size="13" font-weight="bold" fill="#5B7263">客户端层</text>

  <rect x="50" y="110" width="270" height="66" rx="8" fill="#FFFFFF" stroke="#B7C9B5"/>
  <text x="185" y="134" text-anchor="middle" font-size="15" font-weight="bold" fill="#2C3A32">微信小程序 · 老人端</text>
  <text x="185" y="156" text-anchor="middle" font-size="12" fill="#666">uni-app + Vue 3 ｜ 36 页 ｜ 打卡 / SOS / AI 对话</text>

  <rect x="365" y="110" width="270" height="66" rx="8" fill="#FFFFFF" stroke="#B7C9B5"/>
  <text x="500" y="134" text-anchor="middle" font-size="15" font-weight="bold" fill="#2C3A32">微信小程序 · 家属端</text>
  <text x="500" y="156" text-anchor="middle" font-size="12" fill="#666">家庭绑定 ｜ 健康报告 / 告警 / 位置</text>

  <rect x="680" y="110" width="270" height="66" rx="8" fill="#FFF3E2" stroke="#E8A33D" stroke-width="2.5"/>
  <text x="815" y="134" text-anchor="middle" font-size="15" font-weight="bold" fill="#A66410">运营管理 Web 端 ★ 本作品</text>
  <text x="815" y="156" text-anchor="middle" font-size="12" fill="#8A5A12">Vue 3.5 + Element Plus ｜ 7 页 ｜ 告警处置闭环</text>

  <!-- 箭头 -->
  <path d="M 185 194 L 185 222" stroke="#8FA68E" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 500 194 L 500 222" stroke="#8FA68E" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 815 194 L 815 222" stroke="#E8A33D" stroke-width="2.5" marker-end="url(#aro)"/>
  <text x="500" y="214" text-anchor="middle" font-size="11" fill="#7D746B">HTTPS / JSON ｜ Authorization: Bearer &lt;UUID token&gt; ｜ 统一信封 { code, msg, data }</text>

  <!-- 后端层 -->
  <rect x="30" y="232" width="940" height="176" rx="10" fill="#F4F7FB" stroke="#CBD8E8"/>
  <text x="46" y="254" font-size="13" font-weight="bold" fill="#3B5B80">服务层 · Spring Boot 3.2.5 / Java 17 / MyBatis（上下文 /api）</text>

  <rect x="50" y="266" width="205" height="60" rx="7" fill="#FFFFFF" stroke="#A9BFD8"/>
  <text x="152" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C3A32">Controller 层</text>
  <text x="152" y="310" text-anchor="middle" font-size="11" fill="#666">25 个 / 184 个方法级端点</text>

  <rect x="270" y="266" width="205" height="60" rx="7" fill="#FFFFFF" stroke="#A9BFD8"/>
  <text x="372" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C3A32">Service 层</text>
  <text x="372" y="310" text-anchor="middle" font-size="11" fill="#666">9 个 ｜ 鉴权 / 评分 / OCR / 地图</text>

  <rect x="490" y="266" width="205" height="60" rx="7" fill="#FFF9EC" stroke="#D9B26B" stroke-width="2"/>
  <text x="592" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#8A5A12">AI 编排 AiService</text>
  <text x="592" y="310" text-anchor="middle" font-size="11" fill="#8A5A12">缓存 → Ollama → Coze → 规则库</text>

  <rect x="710" y="266" width="240" height="60" rx="7" fill="#FFFFFF" stroke="#A9BFD8"/>
  <text x="830" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C3A32">告警与统计</text>
  <text x="830" y="310" text-anchor="middle" font-size="11" fill="#666">alerts 写入 ｜ Admin 聚合接口</text>

  <rect x="50" y="340" width="900" height="52" rx="7" fill="#FFFFFF" stroke="#A9BFD8"/>
  <text x="500" y="362" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2C3A32">鉴权：Redis UUID token（非 JWT）｜ requireUser / requireAdmin ｜ 密钥统一 ${ENV:} 注入，前端零密钥</text>
  <text x="500" y="381" text-anchor="middle" font-size="11.5" fill="#666">Web 管理端经 /admin/* 消费 AI 与规则链路产生的告警、统计与反馈，形成「发现 → 跟进 → 留痕」闭环</text>

  <!-- 箭头到 AI 与数据层 -->
  <path d="M 592 408 L 592 434" stroke="#D9B26B" stroke-width="2" marker-end="url(#aro)"/>
  <path d="M 300 408 L 300 434" stroke="#8FA68E" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 外部能力层 -->
  <rect x="30" y="442" width="600" height="106" rx="10" fill="#FBF6F1" stroke="#E4D6C4"/>
  <text x="46" y="464" font-size="13" font-weight="bold" fill="#8A6A45">AI 与外部能力（后端中转）</text>
  <rect x="50" y="476" width="135" height="54" rx="6" fill="#FFFFFF" stroke="#D9C5A9"/>
  <text x="117" y="498" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C3A32">① Ollama</text>
  <text x="117" y="516" text-anchor="middle" font-size="10.5" fill="#666">qwen2.5:7b 本地</text>
  <rect x="195" y="476" width="135" height="54" rx="6" fill="#FFFFFF" stroke="#D9C5A9"/>
  <text x="262" y="498" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C3A32">② Coze</text>
  <text x="262" y="516" text-anchor="middle" font-size="10.5" fill="#666">流式 SSE /v3/chat</text>
  <rect x="340" y="476" width="135" height="54" rx="6" fill="#FFFFFF" stroke="#D9C5A9"/>
  <text x="407" y="498" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C3A32">③ 规则库</text>
  <text x="407" y="516" text-anchor="middle" font-size="10.5" fill="#666">12 条，永远可用</text>
  <rect x="485" y="476" width="125" height="54" rx="6" fill="#FFFFFF" stroke="#D9C5A9"/>
  <text x="547" y="498" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C3A32">腾讯云 OCR</text>
  <text x="547" y="516" text-anchor="middle" font-size="10.5" fill="#666">通用文字识别</text>

  <!-- 数据层 -->
  <rect x="650" y="442" width="320" height="106" rx="10" fill="#F2F7F4" stroke="#C9DED1"/>
  <text x="666" y="464" font-size="13" font-weight="bold" fill="#4B7059">数据层</text>
  <rect x="666" y="476" width="140" height="54" rx="6" fill="#FFFFFF" stroke="#B7D0BE"/>
  <text x="736" y="498" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C3A32">MySQL 8 · znwg</text>
  <text x="736" y="516" text-anchor="middle" font-size="10.5" fill="#666">12 张业务表</text>
  <rect x="816" y="476" width="138" height="54" rx="6" fill="#FFFFFF" stroke="#B7D0BE"/>
  <text x="885" y="498" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C3A32">Redis</text>
  <text x="885" y="516" text-anchor="middle" font-size="10.5" fill="#666">token / 验证码 / AI 缓存</text>

  <rect x="30" y="566" width="940" height="74" rx="9" fill="#FDF3F1" stroke="#E7C9C3"/>
  <text x="46" y="588" font-size="13" font-weight="bold" fill="#A5544A">能力边界（源码事实，不作为已实现功能）</text>
  <text x="46" y="609" font-size="11.5" fill="#7A4C46">未实现：RAG / 向量检索 · Agent 工作流 · Function Calling / MCP · 视觉大模型与跌倒姿态识别 · ASR 语音转写 · TTS 语音合成 · 微信支付 · 订阅消息推送 · 云开发</text>
  <text x="46" y="628" font-size="11.5" fill="#7A4C46">语音 / 图像分析当前为「文本描述 → 大模型或关键词规则」的语义分析；默认空 Token 配置下 AI 对话由规则库提供，界面如实回传 provider 标识。</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8FA68E"/>
    </marker>
    <marker id="aro" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#E8A33D"/>
    </marker>
  </defs>
</svg>
